name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Package VSIX
        working-directory: codegraph-navigator
        run: npx @vscode/vsce package --no-dependencies

      - name: Get VSIX filename
        id: vsix
        working-directory: codegraph-navigator
        run: echo "filename=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CodeGraph Navigator v${{ steps.version.outputs.version }}
          body: |
            ## CodeGraph Navigator v${{ steps.version.outputs.version }}

            ### Installation

            Download `${{ steps.vsix.outputs.filename }}` below and install:

            ```bash
            code --install-extension ${{ steps.vsix.outputs.filename }}
            ```

            Or install directly via CLI:

            **Linux / macOS:**
            ```bash
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.vsix.outputs.filename }}" -o /tmp/codegraph-navigator.vsix && code --install-extension /tmp/codegraph-navigator.vsix && rm /tmp/codegraph-navigator.vsix
            ```

            **Windows (PowerShell):**
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.vsix.outputs.filename }}" -OutFile "$env:TEMP\codegraph-navigator.vsix"; code --install-extension "$env:TEMP\codegraph-navigator.vsix"; Remove-Item "$env:TEMP\codegraph-navigator.vsix"
            ```

            Then reload VS Code and look for the **CodeGraph Navigator** icon in the activity bar.
          files: codegraph-navigator/${{ steps.vsix.outputs.filename }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
